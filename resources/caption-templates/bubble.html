<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Transparent stage: the compositor overlays this window onto the video. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #line {
    position: absolute;
    left: 50%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.18em;
    width: 92%;
    transform: translate(-50%, -50%);
    font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 800;
    line-height: 1.25;
  }
  .word {
    display: inline-block;
    padding: 0.08em 0.28em;
    border-radius: 0.3em;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    white-space: nowrap;
    will-change: transform, opacity;
  }
  .word.kw {
    /* gradient text — one of the effects libass structurally cannot do */
    background: rgba(0, 0, 0, 0.72);
    color: transparent;
    background-clip: padding-box;
  }
  .word.kw .t {
    /* 渐变色由品牌高亮色驱动(载入 payload 时写入变量),缺省火焰橙 */
    background: linear-gradient(135deg, var(--hl, #ff6e0d) 0%, var(--hl2, #ffd34d) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
<div id="stage"><div id="line"></div></div>
<script>
/**
 * Deterministic seek contract (HyperFrames-style): the host calls
 * __hotclip_load(payload) once, then __hotclip_seek(tMs) for every output
 * frame. All motion is computed from tMs — no wall clock, no rAF — so the
 * same frame index always rasterises identically.
 */
(function () {
  "use strict";
  var payload = null;
  var lineEl = document.getElementById("line");
  var currentLine = -1;
  var wordEls = [];

  var POP_MS = 240;

  /** easeOutBack — the springy overshoot CapCut-style templates use. */
  function easeOutBack(x) {
    var c1 = 1.70158;
    var c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  // Per-speaker tint for multi-speaker clips (keyword gradient still wins).
  var SPEAKER_COLORS = ["#ffffff", "#7fd4ff", "#ffd36b", "#9dff8f", "#ff9dc4"];

  function buildLine(line) {
    lineEl.innerHTML = "";
    wordEls = line.words.map(function (w) {
      var el = document.createElement("span");
      el.className = "word" + (w.keyword ? " kw" : "");
      var inner = document.createElement("span");
      inner.className = "t";
      inner.textContent = w.text;
      if (!w.keyword && typeof w.speaker === "number") {
        inner.style.color = SPEAKER_COLORS[w.speaker % SPEAKER_COLORS.length];
      }
      el.appendChild(inner);
      lineEl.appendChild(el);
      return el;
    });
  }

  window.__hotclip_load = function (data) {
    payload = data;
    if (data.highlightColor) {
      document.documentElement.style.setProperty("--hl", data.highlightColor);
      document.documentElement.style.setProperty("--hl2", data.highlightColor2 || data.highlightColor);
    }
    lineEl.style.top = data.height * data.baselineFrac + "px";
    lineEl.style.fontSize = data.fontSize + "px";
    currentLine = -1;
    document.title = "loaded";
  };

  window.__hotclip_seek = function (tMs) {
    if (!payload) return;
    var idx = -1;
    for (var i = 0; i < payload.lines.length; i++) {
      var L = payload.lines[i];
      if (tMs >= L.startMs && tMs < L.endMs) { idx = i; break; }
    }
    if (idx !== currentLine) {
      currentLine = idx;
      if (idx >= 0) buildLine(payload.lines[idx]);
      else lineEl.innerHTML = "";
    }
    if (idx < 0) return;
    var line = payload.lines[idx];
    for (var j = 0; j < line.words.length; j++) {
      var w = line.words[j];
      var el = wordEls[j];
      if (!el) continue;
      if (tMs < w.startMs) {
        el.style.opacity = "0";
        el.style.transform = "scale(0.6)";
      } else {
        var p = Math.min(1, (tMs - w.startMs) / POP_MS);
        var e = easeOutBack(p);
        el.style.opacity = String(Math.min(1, p * 2.5));
        el.style.transform = "scale(" + (0.6 + 0.4 * e).toFixed(4) + ")";
      }
    }
  };
})();
</script>
</body>
</html>
