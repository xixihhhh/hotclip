name: 💡 功能建议 / Feature Request
description: 想要一个新功能,或者觉得哪里应该做得更好 / Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        规划中的方向(审阅台/镜头检测/样式模板/多平台发布/MCP…)见 [产品规划](../blob/main/docs/PRODUCT-PLAN.md),想投票或闲聊可以去 [Discussions](../discussions)。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景/问题 / The scenario
      description: 先说场景再说方案——你在切什么内容,卡在哪一步?
      placeholder: 例如:我切访谈播客,每条切片都要手动重调一遍字幕样式,很浪费时间…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的功能 / What you'd like
      placeholder: 例如:希望能把字幕样式存成模板,新任务一键套用
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过的 / Current workaround(可选)
