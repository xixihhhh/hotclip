name: Release

# Tag push (v*) → build installers on native runners and attach them to the
# GitHub Release. Native runners matter: sherpa-onnx-node / ffmpeg-static
# install platform-specific binaries at install time, so cross-building
# would ship the wrong (or no) native addon.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64 dmg
            args: --mac dmg
          - os: windows-latest # nsis installer + portable zip (绿色版)
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build bundles
        run: pnpm build

      - name: Package & publish to GitHub Release
        run: pnpm exec electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned builds for now — signing is a paid-cert decision
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
